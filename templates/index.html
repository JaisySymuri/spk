<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Evaluation (SAW)</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }
        .card {
            border-radius: 12px;
        }
        .title {
            font-weight: 600;
        }
        .result-pass {
            color: #198754;
            font-weight: bold;
        }
        .result-fail {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow p-4">
                <h3 class="text-center mb-4 title">🎓 Student Evaluation (SAW)</h3>

                <form method="post">

                    <!-- Study Hours -->
                    <div class="mb-3">
                        <label class="form-label">Study Hours (per day)</label>
                        <select name="study_hours" class="form-select">
                            <option value="0.2">< 2 hours</option>
                            <option value="0.5">2 - 4 hours</option>
                            <option value="0.8">4 - 6 hours</option>
                            <option value="1.0">> 6 hours</option>
                        </select>
                    </div>

                    <!-- Attendance -->
                    <div class="mb-3">
                        <label class="form-label">Class Attendance (%)</label>
                        <select name="attendance" class="form-select">
                            <option value="0.2">< 60%</option>
                            <option value="0.5">60 - 75%</option>
                            <option value="0.8">75 - 90%</option>
                            <option value="1.0">> 90%</option>
                        </select>
                    </div>

                    <!-- Sleep -->
                    <div class="mb-3">
                        <label class="form-label">Sleep Hours (per night)</label>
                        <select name="sleep_hours" class="form-select">
                            <option value="0.2">< 5 hours</option>
                            <option value="0.5">5 - 6.5 hours</option>
                            <option value="1.0">6.5 - 8 hours (optimal)</option>
                            <option value="0.7">> 8 hours</option>
                        </select>
                    </div>

                    <!-- Study Method -->
                    <div class="mb-3">
                        <label class="form-label">Study Method</label>
                        <select name="study_method" class="form-select">
                            <option>coaching</option>
                            <option>mixed</option>
                            <option>group study</option>
                            <option>online videos</option>
                            <option>self-study</option>
                        </select>
                    </div>

                    <!-- Sleep Quality -->
                    <div class="mb-3">
                        <label class="form-label">Sleep Quality</label>
                        <select name="sleep_quality" class="form-select">
                            <option>poor</option>
                            <option>average</option>
                            <option>good</option>
                        </select>
                    </div>

                    <!-- Facility -->
                    <div class="mb-3">
                        <label class="form-label">Facility</label>
                        <select name="facility" class="form-select">
                            <option>low</option>
                            <option>medium</option>
                            <option>high</option>
                        </select>
                    </div>

                    <!-- Internet -->
                    <div class="mb-3">
                        <label class="form-label">Internet Access</label>
                        <select name="internet" class="form-select">
                            <option>yes</option>
                            <option>no</option>
                        </select>
                    </div>

                    <!-- Difficulty -->
                    <div class="mb-4">
                        <label class="form-label">Exam Difficulty</label>
                        <select name="difficulty" class="form-select">
                            <option>easy</option>
                            <option>moderate</option>
                            <option>hard</option>
                        </select>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            Calculate Score
                        </button>
                    </div>
                </form>

                {% if result %}
                    <hr class="my-4">

                    <div class="text-center">
                        <h4>Score: {{ result.score }}</h4>

                        <h3 class="{% if result.status == 'PASS' %}result-pass{% else %}result-fail{% endif %}">
                            {{ result.status }}
                        </h3>
                    </div>
                {% endif %}

            </div>

        </div>
    </div>
</div>

</body>
</html>
